name: Build Firefox extension

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs deps and copies the Stockfish 18 engine into engine/
      # (via the package's postinstall script).
      - name: Install dependencies + engine
        run: npm install --no-audit --no-fund

      - name: Package .xpi
        run: sh ./scripts/package-firefox.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessable-firefox-xpi
          path: chessable-firefox.xpi
          if-no-files-found: error
